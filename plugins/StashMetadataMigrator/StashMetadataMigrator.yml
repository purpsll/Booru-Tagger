name: Stash Metadata Migrator
description: Restore metadata from an old Stash JSON export onto media already scanned into a new Stash without creating duplicate Scene, Image, or File records.
version: 1.0.0
exec:
  - python
  - "{pluginDir}/StashMetadataMigrator.py"

interface: raw
errLog: info

settings:
  migration_source_path:
    displayName: Old Stash export path
    description: Path inside the Stash environment to the old Stash JSON export ZIP or extracted export folder. For Docker, copy or mount the export somewhere visible to the Stash container, such as /root/.stash/old-stash-export.zip.
    type: STRING

tasks:
  - name: 1. Analyze Old Stash Export (No Changes)
    description: Safely matches old Scenes and Images to media already present in this Stash using MD5/OShash fingerprints first and exact paths only as a fallback. Reports unmatched and ambiguous records and shows which metadata entities would be reused or created. Makes no changes.
    defaultArgs:
      action: analyze

  - name: 2. Restore Metadata to Existing Media
    description: Restores metadata only onto uniquely matched existing Scenes and Images. It never creates Scene, Image, or File records. Existing metadata wins conflicts; old tags/performers/studios are merged into existing entities or created only when no safe match exists.
    defaultArgs:
      action: restore
