name: Stash Metadata Migrator
description: Safely restore complete metadata from an old Stash JSON export onto an existing scanned library, including conservative entity deduplication, Galleries, Groups, chapters, markers, hierarchy, history, and automatic pre-restore backup.
version: 1.1.3
exec:
  - python
  - "{pluginDir}/StashMetadataMigrator.py"

interface: raw
errLog: info

settings:
  migration_source_path:
    displayName: Old Stash export path
    description: Path inside the Stash environment to the old Stash JSON export ZIP or extracted export folder. For Docker, copy or mount the export somewhere visible to the Stash container, such as /root/.stash/old-stash-export.zip.
    type: STRING

tasks:
  - name: 1. Analyze Old Stash Export (No Changes)
    description: Read-only full migration preflight. Matches Scenes/Images by strong fingerprints, identifies safe duplicate Tags/Performers/Studios, resolves Galleries/Groups, and reports ambiguous/unmatched records. Makes no changes.
    defaultArgs:
      action: analyze

  - name: 2. Restore Metadata to Existing Media
    description: Creates an automatic database backup, safely merges formatting-equivalent duplicate Tags/Performers/Studios, restores metadata and relations to existing Scenes/Images, and restores metadata-only Galleries/Groups, chapters, markers, hierarchy, artwork, custom fields, and history. It never creates Scene, Image, or File records.
    defaultArgs:
      action: restore
