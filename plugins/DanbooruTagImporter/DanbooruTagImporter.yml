name: Booru Importer
description: Two-step image metadata importer for Danbooru, Gelbooru, Rule34, e621, and high-confidence SauceNAO sources, with conservative Stash tag, Performer, and Studio deduplication tools.
version: 3.26.24
# Update compatibility: keep the DanbooruTagImporter manifest filename/package ID stable so source-installed copies update in place through Stash.
# e621 IQDB policy: transient failures are image-local; every new image remains eligible. Authenticated file uploads are paced at >=3s, anonymous uploads at >=65s, with adaptive post-429 backoff.
# SauceNAO review policy: >=93.0% auto-import; 85.0-92.9% candidates with a usable source URL enter Review, including external SauceNAO sources. Review-band hits without a usable URL remain pending. Similarity is normalized to one decimal before threshold comparison so any score displayed as 93.0% is treated as HIGH and auto-imported. Review images expose Yes/No controls on the individual image page.
# Yes resolves the exact proposed source and imports through the normal metadata path; No removes that candidate URL and writes Multi-Booru No Match.
# Artist policy: first usable artist becomes Studio; additional artists become tags; conditional_dnp and third-party_edit are ignored as artist metadata.
exec:
  - python
  - "{pluginDir}/DanbooruTagImporter.py"

ui:
  javascript:
    - BooruImporterReview.js

interface: raw
errLog: info

settings:
  danbooru_login:
    displayName: Danbooru login
    description: Optional. Danbooru username used with the API key for authenticated requests and Danbooru IQDB. Exact MD5 lookup still works without it.
    type: STRING

  danbooru_api_key:
    displayName: Danbooru API key
    description: Optional. Used with the Danbooru login for authenticated requests and Danbooru IQDB. Never written to plugin logs.
    type: STRING

  gelbooru_user_id:
    displayName: Gelbooru user ID
    description: Optional. Gelbooru API user ID used with the API key when configured.
    type: STRING

  gelbooru_api_key:
    displayName: Gelbooru API key
    description: Optional. Gelbooru API key used with the user ID when configured. Never written to plugin logs.
    type: STRING

  rule34_user_id:
    displayName: Rule34 user ID
    description: Optional. Rule34 requires both user ID and API key; Rule34 lookups are skipped when either is missing.
    type: STRING

  rule34_api_key:
    displayName: Rule34 API key
    description: Optional. Rule34 requires both user ID and API key; Rule34 lookups are skipped when either is missing. Never written to plugin logs.
    type: STRING

  e621_username:
    displayName: e621 username
    description: Strongly recommended for Deep Match. Used in the identifying e621 User-Agent and with the API key for authenticated requests. Authenticated IQDB file searches can run far more frequently than anonymous file searches.
    type: STRING

  e621_api_key:
    displayName: e621 API key
    description: Strongly recommended with the e621 username for authenticated Deep Match IQDB requests. Never written to plugin logs.
    type: STRING

  saucenao_api_key:
    displayName: SauceNAO API key
    description: Optional. Enables the SauceNAO Deep Match fallback. If omitted, SauceNAO is skipped. Never written to plugin logs.
    type: STRING

  saucenao_requests_per_30_seconds:
    displayName: SauceNAO searches per 30 seconds
    description: Maximum SauceNAO polling rate. Leave blank or set 0 for Auto (recommended); the plugin reads the account-specific short-term limit returned by SauceNAO, so paid/upgraded accounts automatically run faster. A positive value caps the plugin below that allowance; it never intentionally exceeds SauceNAO's reported limit.
    type: NUMBER

tasks:
  - name: 1. Scan Unprocessed Images (Fast)
    description: Start here. Quickly checks only images that have not been classified yet using exact MD5 matches and trusted local pHash matches. Matches become Imported; clean misses are queued as Unresolved for Deep Match.
    defaultArgs:
      mode: import_all
      lookup_mode: fast
      dry_run: false

  - name: 2. Preview Deep Match (10 Unresolved, No Changes)
    description: Optional safety preview before the slower Deep Match. Tests the full lookup chain on the next 10 Unresolved images and shows what would happen without changing Stash.
    defaultArgs:
      mode: import_all
      lookup_mode: deep
      dry_run: true
      limit: 10
      force_recheck: false

  - name: 3. Deep Match All Unresolved Images
    description: Runs the slower reverse-image-search pass only on images queued as Unresolved. High-confidence matches become Imported; SauceNAO results from 85.0-92.9% with a usable source URL become Review, including external sources; authoritative misses become No Match. Review-band hits without a usable URL and temporary provider failures stay Unresolved for a later retry.
    defaultArgs:
      mode: import_all
      lookup_mode: deep
      dry_run: false
      force_recheck: false

  - name: 4. Recheck Review Candidates
    description: Rechecks only images in the Review queue. You can also open an individual Review image and use Yes to import the proposed source normally or No to mark it No Match. A stronger recheck can promote an image to Imported; otherwise it can remain Review or move to No Match after an authoritative miss.
    defaultArgs:
      mode: import_all
      lookup_mode: deep
      dry_run: false
      force_recheck: true
      only_review: true

  - name: 5. Retry No-Match Images
    description: Rechecks only images currently marked No Match. Use this later if booru databases or reverse-search indexes may have gained new matches.
    defaultArgs:
      mode: import_all
      lookup_mode: deep
      dry_run: false
      force_recheck: true
      only_no_match: true

  - name: 6. Scan Similar Tags (No Changes)
    description: Safely scans the Stash tag library for likely duplicates. Exact formatting variants are labeled SAFE; fuzzy matches and tags with conflicting metadata are labeled REVIEW. This task never changes Stash.
    defaultArgs:
      mode: tag_cleanup
      cleanup_action: scan

  - name: 7. Merge Safe Duplicate Tags
    description: Merges only SAFE formatting duplicates whose letters/numbers are identical after case, spacing, underscore, hyphen, punctuation, or legacy category-prefix normalization. Fuzzy matches and metadata conflicts are never merged automatically.
    defaultArgs:
      mode: tag_cleanup
      cleanup_action: merge_safe

  - name: 8. Show Similar Tag Review Candidates
    description: Lists only ambiguous/fuzzy similar-tag candidates that require manual judgment. This task never changes Stash.
    defaultArgs:
      mode: tag_cleanup
      cleanup_action: review

  - name: 9. Scan Similar Performers (No Changes)
    description: Scans Performer names and aliases for likely duplicates. Exact formatting variants are SAFE; fuzzy names, conflicting performer metadata, or disagreeing same-endpoint Stash IDs are REVIEW. No changes are made.
    defaultArgs:
      mode: entity_cleanup
      entity_type: performer
      cleanup_action: scan

  - name: 10. Merge Safe Duplicate Performers
    description: Uses Stash's native Performer merge only for SAFE formatting duplicates. Names become aliases and URLs, tags, Stash IDs, and attached media are preserved. Fuzzy or conflicting Performers are never auto-merged.
    defaultArgs:
      mode: entity_cleanup
      entity_type: performer
      cleanup_action: merge_safe

  - name: 11. Show Similar Performer Review Candidates
    description: Lists fuzzy or conflicting Performer candidates that require manual judgment. This task never changes Stash.
    defaultArgs:
      mode: entity_cleanup
      entity_type: performer
      cleanup_action: review

  - name: 12. Scan Similar Studios (No Changes)
    description: Scans Studio names and aliases for likely duplicates. Exact formatting variants are SAFE; fuzzy names, hierarchy/metadata conflicts, or disagreeing same-endpoint Stash IDs are REVIEW. No changes are made.
    defaultArgs:
      mode: entity_cleanup
      entity_type: studio
      cleanup_action: scan

  - name: 13. Merge Safe Duplicate Studios
    description: Safely merges only formatting-equivalent Studios. URLs and tags are preserved, all attached Scenes/Images/Galleries/Groups are reassigned to the survivor, and source names become aliases. Fuzzy or conflicting Studios are never auto-merged.
    defaultArgs:
      mode: entity_cleanup
      entity_type: studio
      cleanup_action: merge_safe

  - name: 14. Show Similar Studio Review Candidates
    description: Lists fuzzy, hierarchy-conflicting, or metadata-conflicting Studio candidates that require manual judgment. This task never changes Stash.
    defaultArgs:
      mode: entity_cleanup
      entity_type: studio
      cleanup_action: review
