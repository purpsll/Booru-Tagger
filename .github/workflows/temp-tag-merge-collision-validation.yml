name: Temporary Tag Merge Collision Validation

on:
  push:
    branches:
      - fix/tag-merge-alias-collisions

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Booru Importer
        run: python -m py_compile plugins/DanbooruTagImporter/*.py
      - name: Run Booru Importer regression suite
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s plugins/DanbooruTagImporter/tests -v
      - name: Run Metadata Migrator regression suite
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s plugins/StashMetadataMigrator/tests -v
