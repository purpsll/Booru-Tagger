name: Validate e621 IQDB adaptive pacing 3.26.6

on:
  push:
    branches:
      - test/e621-iqdb-adaptive-pacing-3266

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Narrow guarded patch anchors
        run: python tools/fix_apply_e621_iqdb_pacing_3266.py

      - name: Apply guarded patch
        run: python tools/apply_e621_iqdb_pacing_3266.py

      - name: Compile source
        run: python -m py_compile plugins/DanbooruTagImporter/*.py

      - name: Run regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s plugins/DanbooruTagImporter/tests -v

      - name: Validate release version and source package
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'version: 3.26.6' plugins/DanbooruTagImporter/DanbooruTagImporter.yml
          grep -qx 'VERSION = "3.26.6"' plugins/DanbooruTagImporter/constants.py
          grep -q 'E621_IQDB_AUTH_MIN_INTERVAL_SECONDS = 2.0' plugins/DanbooruTagImporter/constants.py
          grep -q 'E621_IQDB_ANON_MIN_INTERVAL_SECONDS = 65.0' plugins/DanbooruTagImporter/constants.py
          grep -q '_e621_iqdb_note_rate_limit' plugins/DanbooruTagImporter/DanbooruTagImporter.py
          grep -q '3.26.6' README.md
          git diff --check
          chmod +x build_site.sh
          ./build_site.sh
          grep -q 'id: DanbooruTagImporter' _site/index.yml
          grep -q 'version: 3.26.6-' _site/index.yml
          test -f _site/DanbooruTagImporter.zip

      - name: Commit tested changes to validation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/release.yml plugins/DanbooruTagImporter
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Pace e621 IQDB requests within provider limits'
          git push origin HEAD:test/e621-iqdb-adaptive-pacing-3266
