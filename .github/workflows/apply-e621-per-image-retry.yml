name: Apply e621 Per-Image Retry Patch

on:
  push:
    paths:
      - '.github/workflows/apply-e621-per-image-retry.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/_apply_e621_per_image_retry_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('plugins/DanbooruTagImporter/DanbooruTagImporter.py')
          text = path.read_text(encoding='utf-8')
          old = '        started = float(stats.pop("_started_at_monotonic", time.monotonic()))\n'
          new = '    started = float(stats.pop("_started_at_monotonic", time.monotonic()))\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one indentation repair target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate source and tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile plugins/DanbooruTagImporter/DanbooruTagImporter.py plugins/DanbooruTagImporter/network.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s plugins/DanbooruTagImporter/tests -v

      - name: Validate Stash source package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/booru-site
          bash build_site.sh /tmp/booru-site
          grep -q '^\- id: DanbooruTagImporter$' /tmp/booru-site/index.yml
          grep -q '^  name: Booru Importer$' /tmp/booru-site/index.yml
          grep -q '^  version: 3.26.5-' /tmp/booru-site/index.yml
          grep -q '^  path: DanbooruTagImporter.zip$' /tmp/booru-site/index.yml
          unzip -p /tmp/booru-site/DanbooruTagImporter.zip DanbooruTagImporter.yml | grep -q '^version: 3.26.5$'
          cat /tmp/booru-site/index.yml

      - name: Commit tested plugin changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/release.yml
          git rm tools/_apply_e621_per_image_retry_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md plugins/DanbooruTagImporter
          git diff --cached --check
          git commit -m 'Retry e621 IQDB independently for every image'
          git push origin HEAD:main
