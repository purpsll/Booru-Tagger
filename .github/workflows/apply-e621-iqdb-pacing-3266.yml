name: Apply e621 IQDB pacing 3.26.6

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-e621-iqdb-pacing-3266.yml'

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load guarded patch helpers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/purpsll/Booru-Tagger/test/e621-iqdb-adaptive-pacing-3266/tools/apply_e621_iqdb_pacing_3266.py' -o tools/apply_e621_iqdb_pacing_3266.py
          curl -fsSL 'https://raw.githubusercontent.com/purpsll/Booru-Tagger/test/e621-iqdb-adaptive-pacing-3266/tools/fix_apply_e621_iqdb_pacing_3266.py' -o tools/fix_apply_e621_iqdb_pacing_3266.py
          python tools/fix_apply_e621_iqdb_pacing_3266.py
          python tools/apply_e621_iqdb_pacing_3266.py

      - name: Compile source
        run: python -m py_compile plugins/DanbooruTagImporter/*.py

      - name: Run regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s plugins/DanbooruTagImporter/tests -v

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'version: 3.26.6' plugins/DanbooruTagImporter/DanbooruTagImporter.yml
          grep -qx 'VERSION = "3.26.6"' plugins/DanbooruTagImporter/constants.py
          grep -q 'E621_IQDB_AUTH_MIN_INTERVAL_SECONDS = 2.0' plugins/DanbooruTagImporter/constants.py
          grep -q 'E621_IQDB_ANON_MIN_INTERVAL_SECONDS = 65.0' plugins/DanbooruTagImporter/constants.py
          grep -q '_e621_iqdb_note_rate_limit' plugins/DanbooruTagImporter/DanbooruTagImporter.py
          git diff --check
          chmod +x build_site.sh
          ./build_site.sh
          grep -q 'id: DanbooruTagImporter' _site/index.yml
          grep -q 'version: 3.26.6-' _site/index.yml
          test -f _site/DanbooruTagImporter.zip

      - name: Commit tested plugin and documentation changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md plugins/DanbooruTagImporter
          git diff --cached --check
          git commit -m 'Pace e621 IQDB requests within provider limits'
          git push origin HEAD:main
