name: Apply secondary artist tag fix

on:
  push:
    paths:
      - '.github/workflows/apply-secondary-artist-tag-fix.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply secondary artist tag policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          plugin_path = Path('plugins/DanbooruTagImporter/DanbooruTagImporter.py')
          text = plugin_path.read_text(encoding='utf-8')

          old_mapping = '''    # Map structured categories according to user policy.\n    if artist_mapping in {"tags", "both"}:\n        existing_name_keys = {n.casefold() for n in names}\n        for artist in artists:\n            if artist.casefold() not in existing_name_keys:\n                names.append(artist)\n                existing_name_keys.add(artist.casefold())\n    elif source in {"gelbooru", "rule34"} and artists:\n        # Gelbooru-style post payloads start as one flat tag list. Once artist\n        # category metadata is known and artists are mapped to Studios, do not\n        # also create duplicate ordinary Stash tags for those same names.\n        artist_keys = {a.casefold() for a in artists}\n        names = [n for n in names if n.casefold() not in artist_keys]\n\n'''

          new_mapping = '''    studio_artists = (\n        [\n            artist for artist in artists\n            if str(artist).strip().casefold() != "conditional_dnp"\n        ]\n        if artist_mapping in {"studios", "both"}\n        else []\n    )\n\n    # Map structured categories according to user policy.\n    if artist_mapping in {"tags", "both"}:\n        existing_name_keys = {n.casefold() for n in names}\n        for artist in artists:\n            if artist.casefold() not in existing_name_keys:\n                names.append(artist)\n                existing_name_keys.add(artist.casefold())\n    elif artist_mapping == "studios":\n        if source in {"gelbooru", "rule34"} and artists:\n            # Gelbooru-style post payloads start as one flat tag list. Remove\n            # artist-category entries first, then add back only secondary real\n            # artists as ordinary tags. The first usable artist is the Studio.\n            artist_keys = {a.casefold() for a in artists}\n            names = [n for n in names if n.casefold() not in artist_keys]\n\n        # A Stash image has one Studio slot. Preserve every additional real\n        # artist as an image tag instead of silently dropping that metadata.\n        existing_name_keys = {n.casefold() for n in names}\n        for artist in studio_artists[1:]:\n            if artist.casefold() not in existing_name_keys:\n                names.append(artist)\n                existing_name_keys.add(artist.casefold())\n\n'''

          if old_mapping in text:
              text = text.replace(old_mapping, new_mapping, 1)
          elif new_mapping not in text:
              raise SystemExit('artist mapping block did not match expected source')

          old_studio_block = '''    studio_artists = (\n        [\n            artist for artist in artists\n            if str(artist).strip().casefold() != "conditional_dnp"\n        ]\n        if artist_mapping in {"studios", "both"}\n        else []\n    )\n'''
          # The mapping block now computes studio_artists before tag routing.
          first = text.find(old_studio_block)
          second = text.find(old_studio_block, first + len(old_studio_block)) if first >= 0 else -1
          if second >= 0:
              text = text[:second] + text[second + len(old_studio_block):]
          elif text.count(old_studio_block) != 1:
              raise SystemExit('unexpected studio_artists block count')

          plugin_path.write_text(text, encoding='utf-8')

          constants_path = Path('plugins/DanbooruTagImporter/constants.py')
          constants = constants_path.read_text(encoding='utf-8')
          constants = constants.replace('VERSION = "3.26.1"', 'VERSION = "3.26.2"', 1)
          constants_path.write_text(constants, encoding='utf-8')

          manifest_path = Path('plugins/DanbooruTagImporter/DanbooruTagImporter.yml')
          manifest = manifest_path.read_text(encoding='utf-8')
          manifest = manifest.replace('version: 3.26.1', 'version: 3.26.2', 1)
          manifest = manifest.replace(
              '# Studio policy: the placeholder artist conditional_dnp is ignored when choosing a Studio.',
              '# Artist policy: first usable artist becomes Studio; additional artists become tags; conditional_dnp is ignored as artist metadata.',
              1,
          )
          manifest_path.write_text(manifest, encoding='utf-8')

          task_path = Path('plugins/DanbooruTagImporter/tests/test_task_menu.py')
          task_text = task_path.read_text(encoding='utf-8')
          task_text = task_text.replace('self.assertEqual(yaml_version, "3.26.1")', 'self.assertEqual(yaml_version, "3.26.2")', 1)
          task_path.write_text(task_text, encoding='utf-8')

          test_path = Path('plugins/DanbooruTagImporter/tests/test_plugin_safety.py')
          tests = test_path.read_text(encoding='utf-8')
          test_name = 'test_secondary_artists_become_tags_while_primary_becomes_studio'
          if test_name not in tests:
              marker = '    def test_conditional_dnp_artist_is_skipped_for_studio_selection(self):\n'
              if marker not in tests:
                  raise SystemExit('test insertion marker not found')
              addition = '''    def test_secondary_artists_become_tags_while_primary_becomes_studio(self):\n        stash = ProcessFakeStash()\n        settings = {"gelbooru_api_key": "gkey", "gelbooru_user_id": "42"}\n        post = {\n            "id": 12345,\n            "tags": "conditional_dnp primary_artist secondary_artist third_artist blue_hair",\n        }\n        typed = {\n            "conditional_dnp": 1,\n            "primary_artist": 1,\n            "secondary_artist": 1,\n            "third_artist": 1,\n            "blue_hair": 0,\n        }\n        with mock.patch.object(plugin, "ENABLE_DANBOORU", False), \\\n             mock.patch.object(plugin, "ENABLE_RULE34", False), \\\n             mock.patch.object(plugin, "ENABLE_E621", False), \\\n             mock.patch.object(plugin, "ENABLE_LOCAL_PHASH_REUSE", False), \\\n             mock.patch.object(plugin, "gelbooru_post", return_value=post), \\\n             mock.patch.object(plugin, "gelbooru_style_tag_metadata", return_value=typed), \\\n             mock.patch.object(plugin, "ensure_studio", return_value={"id": "studio-1", "name": "primary_artist"}) as ensure_studio, \\\n             mock.patch.object(plugin, "ensure_tags", return_value=[]) as ensure_tags:\n            result = plugin.process_image(\n                stash, md5_image(), settings, {}, False, {}, {}, {}, {},\n                plugin.PHashIndex(), lookup_mode="fast",\n            )\n\n        self.assertEqual(result, "updated_gelbooru")\n        self.assertEqual([call.args[2] for call in ensure_studio.call_args_list], ["primary_artist"])\n        imported_names = list(ensure_tags.call_args.args[2])\n        self.assertIn("secondary_artist", imported_names)\n        self.assertIn("third_artist", imported_names)\n        self.assertIn("blue_hair", imported_names)\n        self.assertNotIn("primary_artist", imported_names)\n        self.assertNotIn("conditional_dnp", imported_names)\n\n'''
              tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests, encoding='utf-8')

          readme_path = Path('plugins/DanbooruTagImporter/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          if readme.startswith('# Booru Importer v3.26.0'):
              readme = readme.replace('# Booru Importer v3.26.0', '# Booru Importer v3.26.2', 1)
          elif readme.startswith('# Booru Importer v3.26.1'):
              readme = readme.replace('# Booru Importer v3.26.1', '# Booru Importer v3.26.2', 1)
          old_goal = 'v3.26.1 adds a Studio-selection guard for the booru placeholder artist `conditional_dnp`. When it appears in an artist list, it is ignored for Studio assignment and the next real artist is selected. This release retains the public-release hardening and account-aware SauceNAO throughput introduced in v3.26.0, without changing the established matching thresholds or five-task workflow.'
          new_goal = 'v3.26.2 preserves multi-artist metadata correctly: the first usable artist is assigned as the image Studio, while every additional usable artist is retained as an ordinary Stash tag. The booru placeholder `conditional_dnp` is ignored as artist metadata, so it cannot displace the real Studio or become a secondary-artist tag. This release retains the public-release hardening and account-aware SauceNAO throughput introduced in v3.26.0 without changing the established matching thresholds or five-task workflow.'
          if old_goal in readme:
              readme = readme.replace(old_goal, new_goal, 1)
          readme_path.write_text(readme, encoding='utf-8')
          PY

          git diff --check
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s plugins/DanbooruTagImporter/tests -v

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "purpsll"
          git config user.email "105087296+purpsll@users.noreply.github.com"
          git add plugins/DanbooruTagImporter
          git commit -m "Preserve secondary artists as image tags"
          git push origin HEAD:main
