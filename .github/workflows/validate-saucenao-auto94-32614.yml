name: Validate SauceNAO auto-import 94 percent 3.26.14

on:
  push:
    branches:
      - test/saucenao-auto94-32614
    paths:
      - '.github/workflows/validate-saucenao-auto94-32614.yml'
      - 'README.md'
      - 'plugins/DanbooruTagImporter/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile source and check UI syntax
        run: |
          python -m py_compile plugins/DanbooruTagImporter/*.py
          node --check plugins/DanbooruTagImporter/BooruImporterReview.js

      - name: Run regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s plugins/DanbooruTagImporter/tests -v

      - name: Validate SauceNAO 94 percent policy and package
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'VERSION = "3.26.14"' plugins/DanbooruTagImporter/constants.py
          grep -qx 'version: 3.26.14' plugins/DanbooruTagImporter/DanbooruTagImporter.yml
          grep -qx 'SAUCENAO_HIGH_CONFIDENCE = 94.0' plugins/DanbooruTagImporter/constants.py
          grep -qx 'SAUCENAO_REVIEW_MINIMUM = 85.0' plugins/DanbooruTagImporter/constants.py
          grep -Fq 'Review band: 85.0–93.9%' plugins/DanbooruTagImporter/BooruImporterReview.js
          grep -Fq 'displayed as **94.0%** is HIGH' README.md
          grep -Fq 'SauceNAO HIGH: >=94.0%' plugins/DanbooruTagImporter/README.md
          ! grep -R -E '85.?94\.99|SauceNAO HIGH: >=95|automatic SauceNAO imports at 95' README.md plugins/DanbooruTagImporter/README.md plugins/DanbooruTagImporter/DanbooruTagImporter.yml plugins/DanbooruTagImporter/BooruImporterReview.js
          git diff --check
          chmod +x build_site.sh
          ./build_site.sh
          grep -q 'id: DanbooruTagImporter' _site/index.yml
          grep -q 'version: 3.26.14-' _site/index.yml
          test -f _site/DanbooruTagImporter.zip
          unzip -l _site/DanbooruTagImporter.zip | grep -q 'DanbooruTagImporter.py'
