name: Publish Booru Importer Release
# Keep release assets aligned with the final source-installed plugin tree.

on:
  push:
    paths:
      - '.github/workflows/release.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate plugin
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s plugins/DanbooruTagImporter/tests -v

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(grep '^version:' plugins/DanbooruTagImporter/DanbooruTagImporter.yml | head -1 | awk '{print $2}')"
          ASSET="Booru-Importer-v${VERSION}.zip"

          # GitHub Releases are intended to be easy to install manually. Keep the
          # plugin directory as the top-level folder so users can extract it and
          # copy DanbooruTagImporter directly into their Stash plugins directory.
          rm -rf release-package "$ASSET"
          mkdir -p release-package/DanbooruTagImporter
          cp -a plugins/DanbooruTagImporter/. release-package/DanbooruTagImporter/
          find release-package -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          find release-package -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          (
            cd release-package
            zip -r "../$ASSET" DanbooruTagImporter >/dev/null
          )

          unzip -Z1 "$ASSET" | grep -qx 'DanbooruTagImporter/DanbooruTagImporter.yml'
          unzip -Z1 "$ASSET" | grep -qx 'DanbooruTagImporter/DanbooruTagImporter.py'

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Write release notes
        shell: bash
        run: |
          cat > release-v3.26.0.md <<'EOF'
          ## Booru Importer v3.26.0 — Initial Public Release

          The first public release of **Booru Importer**, a Stash plugin that identifies images using Danbooru, Gelbooru, Rule34, e621, and optional reverse-image-search services, then imports useful metadata into Stash.

          ### Included in this release

          - Renamed the public-facing plugin to **Booru Importer** while keeping the internal `DanbooruTagImporter` ID for compatibility.
          - Corrected the repository layout for the Stash plugin-source format and GitHub Pages publishing.
          - Added a user-friendly repository README and plugin-source installation instructions.
          - Fast Scan uses exact MD5 lookups and trusted local pHash reuse before slower searches.
          - Deep Match can use Danbooru IQDB, e621 IQDB, and SauceNAO for unresolved images.
          - Imports booru tags and source URLs and fills a missing source date when available.
          - Maps booru characters to Stash Performers and artists to Stash Studio metadata.
          - Uses conservative fuzzy matching to reuse similar existing Studios, Performers, and tags instead of creating obvious duplicates.
          - SauceNAO request pacing can be configured and automatically adapts to account-reported limits, including paid/upgraded accounts.
          - Existing ordinary Stash metadata is preserved; the plugin does not replace or download source image files.
          - Provider rate limits and temporary failures remain retryable instead of creating false permanent no-match results.

          ### Installation

          The recommended installation method is the Stash plugin source:

          `https://purpsll.github.io/Booru-Tagger/main/index.yml`

          Then refresh Available Plugins and install **Booru Importer**.
          EOF

          cat > release-current.md <<'EOF'
          ## Booru Importer v3.26.10

          This release expands the SauceNAO Review workflow while keeping automatic imports conservative.

          ### SauceNAO confidence policy

          - **Automatic import remains 95%+.**
          - **Review now starts at 85%.** Supported SauceNAO candidates from 85–94.99% are marked `Multi-Booru Review` rather than discarded.
          - Results below 85% remain non-qualifying.
          - The lower Review floor does not auto-import lower-confidence matches.

          ### Individual image Review controls

          Review images now show the proposed supported booru URL directly on the individual Stash image page with two explicit decisions:

          - **Yes — import this source:** resolves that exact Danbooru, Gelbooru, Rule34, or e621 post and feeds it through the normal metadata importer. Tags, first-artist Studio mapping, additional artist tags, character Performers, source date, and canonical source URL follow the same preservation rules as automatic imports. The image is then marked `Multi-Booru Imported`.
          - **No — mark No Match:** rejects the candidate, removes only that rejected candidate URL, preserves ordinary user metadata and URLs, replaces the Review marker with `Multi-Booru No Match`, and imports no candidate metadata.

          The backend verifies that the submitted URL is still the active Review candidate. Review transitions keep that candidate URL last in the image URL list so multiple existing booru URLs cannot make the decision ambiguous.

          ### Compatibility and safety

          - Uses Stash's supported `ImageDetailPanel` UI plugin patch point and synchronous `runPluginOperation` API available in Stash v0.31.1.
          - The Review UI respects Stash's configured base path rather than assuming the server is mounted at `/`.
          - The stable internal package ID remains `DanbooruTagImporter` so source-installed copies continue to update in place.
          - Existing automatic matching thresholds other than the Review floor are unchanged.
          - SauceNAO HTTP 500/52x resilience, e621 pacing, Retry Later safeguards, and metadata-preservation behavior from 3.26.9 are retained.

          ### Validation

          - Full regression suite passes with **95 tests**.
          - JavaScript syntax validation passes for `BooruImporterReview.js`.
          - Tests cover Yes importing through the normal metadata path, No writing No Match while removing only the candidate URL, active-candidate validation, and candidate URL ordering.
          - The generated Stash source package is validated to contain the Review UI JavaScript and stable package identity.

          ### Recommended installation / update

          Add or refresh this source in **Stash → Settings → Plugins**:

          `https://purpsll.github.io/Booru-Tagger/main/index.yml`

          Existing source-based users should see **Booru Importer 3.26.10** as an update after refreshing plugin sources if needed.

          ### Manual installation from GitHub Releases

          Download **`Booru-Importer-v3.26.10.zip`** from the release Assets, extract the top-level `DanbooruTagImporter` folder, and replace the files in your existing manual installation.

          EOF

      - name: Update initial public release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit Public_Release \
            --repo "$GITHUB_REPOSITORY" \
            --title "Booru Importer v3.26.0 (Initial Public Release)" \
            --notes-file release-v3.26.0.md

      - name: Publish current version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Booru Importer v${VERSION}" \
              --notes-file release-current.md \
              --latest
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Booru Importer v${VERSION}" \
              --notes-file release-current.md \
              --latest
          fi

          gh release upload "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
