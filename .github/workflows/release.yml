name: Publish Booru Importer Release
# Keep release assets aligned with the final source-installed plugin tree.

on:
  push:
    paths:
      - '.github/workflows/release.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate plugin
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s plugins/DanbooruTagImporter/tests -v

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(grep '^version:' plugins/DanbooruTagImporter/DanbooruTagImporter.yml | head -1 | awk '{print $2}')"
          ASSET="Booru-Importer-v${VERSION}.zip"

          # GitHub Releases are intended to be easy to install manually. Keep the
          # plugin directory as the top-level folder so users can extract it and
          # copy DanbooruTagImporter directly into their Stash plugins directory.
          rm -rf release-package "$ASSET"
          mkdir -p release-package/DanbooruTagImporter
          cp -a plugins/DanbooruTagImporter/. release-package/DanbooruTagImporter/
          find release-package -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          find release-package -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          (
            cd release-package
            zip -r "../$ASSET" DanbooruTagImporter >/dev/null
          )

          unzip -Z1 "$ASSET" | grep -qx 'DanbooruTagImporter/DanbooruTagImporter.yml'
          unzip -Z1 "$ASSET" | grep -qx 'DanbooruTagImporter/DanbooruTagImporter.py'

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Write release notes
        shell: bash
        run: |
          cat > release-v3.26.0.md <<'EOF'
          ## Booru Importer v3.26.0 — Initial Public Release

          The first public release of **Booru Importer**, a Stash plugin that identifies images using Danbooru, Gelbooru, Rule34, e621, and optional reverse-image-search services, then imports useful metadata into Stash.

          ### Included in this release

          - Renamed the public-facing plugin to **Booru Importer** while keeping the internal `DanbooruTagImporter` ID for compatibility.
          - Corrected the repository layout for the Stash plugin-source format and GitHub Pages publishing.
          - Added a user-friendly repository README and plugin-source installation instructions.
          - Fast Scan uses exact MD5 lookups and trusted local pHash reuse before slower searches.
          - Deep Match can use Danbooru IQDB, e621 IQDB, and SauceNAO for unresolved images.
          - Imports booru tags and source URLs and fills a missing source date when available.
          - Maps booru characters to Stash Performers and artists to Stash Studio metadata.
          - Uses conservative fuzzy matching to reuse similar existing Studios, Performers, and tags instead of creating obvious duplicates.
          - SauceNAO request pacing can be configured and automatically adapts to account-reported limits, including paid/upgraded accounts.
          - Existing ordinary Stash metadata is preserved; the plugin does not replace or download source image files.
          - Provider rate limits and temporary failures remain retryable instead of creating false permanent no-match results.

          ### Installation

          The recommended installation method is the Stash plugin source:

          `https://purpsll.github.io/Booru-Tagger/main/index.yml`

          Then refresh Available Plugins and install **Booru Importer**.
          EOF

          cat > release-current.md <<'EOF'
          ## Booru Importer v3.26.11

          This patch fixes the React crash introduced by the individual-image Review controls in v3.26.10.

          ### Fixed

          - Corrected the Stash `ImageDetailPanel` `patch.after` callback signature from two arguments to three:
            `(props, _context, rendered)`.
          - React passes an empty context object as the second original argument. v3.26.10 mistakenly treated that `{}` object as the rendered component, causing minified React error #31 when opening an image page.
          - The Review panel now receives and renders the actual third `rendered` argument.

          ### Review workflow retained

          - SauceNAO automatic import remains **95%+**.
          - SauceNAO **85–94.99%** remains `Multi-Booru Review`.
          - **Yes — import this source** still resolves that exact supported booru post and imports it through the normal metadata path.
          - **No — mark No Match** still removes only the rejected candidate URL and writes `Multi-Booru No Match`.
          - Existing metadata-preservation, active-candidate validation, and source-URL ordering safeguards are unchanged.

          ### Validation

          - Full regression suite passes with **95 tests**.
          - JavaScript syntax validation passes.
          - The release gate explicitly verifies the corrected three-argument `ImageDetailPanel` callback and rejects the old two-argument form.
          - The generated Stash package is verified to contain the updated `BooruImporterReview.js`.

          ### Update

          Refresh this Stash plugin source if needed:

          `https://purpsll.github.io/Booru-Tagger/main/index.yml`

          Existing source-based installs should show **Booru Importer 3.26.11** under **Installed Plugins → Update**.

          ### Manual installation

          Download **`Booru-Importer-v3.26.11.zip`** from the release Assets, extract the top-level `DanbooruTagImporter` folder, and replace the files in your existing manual installation.

          EOF

      - name: Update initial public release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit Public_Release \
            --repo "$GITHUB_REPOSITORY" \
            --title "Booru Importer v3.26.0 (Initial Public Release)" \
            --notes-file release-v3.26.0.md

      - name: Publish current version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Booru Importer v${VERSION}" \
              --notes-file release-current.md \
              --latest
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Booru Importer v${VERSION}" \
              --notes-file release-current.md \
              --latest
          fi

          gh release upload "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
