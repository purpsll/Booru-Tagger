          if 'test_unresolved_deep_skips_fast_md5_and_phash_stages' not in tests:
              addition = '''    def test_unresolved_deep_skips_fast_md5_and_phash_stages(self):
        stash = ProcessFakeStash()
        img = md5_image()
        img["tags"] = [{"id": "u", "name": plugin.UNRESOLVED_MARKER_TAG}]
        with mock.patch.object(plugin, "ENABLE_DANBOORU_IQDB", False), \
             mock.patch.object(plugin, "ENABLE_E621_IQDB", False), \
             mock.patch.object(plugin, "ENABLE_SAUCENAO", False), \
             mock.patch.object(plugin, "danbooru_post") as danbooru_post, \
             mock.patch.object(plugin, "gelbooru_post") as gelbooru_post, \
             mock.patch.object(plugin, "rule34_post") as rule34_post, \
             mock.patch.object(plugin, "e621_post") as e621_post, \
             mock.patch.object(plugin, "_try_local_phash_reuse") as phash:
            plugin.process_image(
                stash, img, {}, {}, True, {}, {}, {}, {}, plugin.PHashIndex(),
                lookup_mode="deep",
            )
        danbooru_post.assert_not_called()
        gelbooru_post.assert_not_called()
        rule34_post.assert_not_called()
        e621_post.assert_not_called()
        phash.assert_not_called()

    def test_deep_visual_providers_execute_concurrently(self):
        import threading
        stash = ProcessFakeStash()
        img = md5_image()
        img["tags"] = [{"id": "u", "name": plugin.UNRESOLVED_MARKER_TAG}]
        barrier = threading.Barrier(3, timeout=2.0)

        def miss_together(*args, **kwargs):
            barrier.wait()
            return None

        settings = {
            "danbooru_login": "user",
            "danbooru_api_key": "key",
            "saucenao_api_key": "sauce",
        }
        with mock.patch.object(plugin, "danbooru_iqdb", side_effect=miss_together), \
             mock.patch.object(plugin, "e621_iqdb", side_effect=miss_together), \
             mock.patch.object(plugin, "saucenao_resolve", side_effect=miss_together):
            result = plugin.process_image(
                stash, img, settings, {}, True, {}, {}, {}, {}, plugin.PHashIndex(),
                lookup_mode="deep",
            )
        self.assertEqual(result, "no_match")

'''
              tests = tests.replace(marker, addition + marker, 1)
          safety_path.write_text(tests, encoding='utf-8')

          network_test_path = Path('plugins/DanbooruTagImporter/tests/test_network.py')
          network_tests = network_test_path.read_text(encoding='utf-8')
          if 'test_cloudflare_521_is_retryable' not in network_tests:
              insert = '''
    def test_cloudflare_521_is_retryable(self):
        exc = urllib.error.HTTPError(
            "https://saucenao.com", 521, "down", {}, None
        )
        self.assertTrue(is_retryable_exception(exc))
'''
              marker_net = '\n\nclass Rule34CooldownNetworkTests'
              if marker_net not in network_tests:
                  raise SystemExit('network test insertion marker not found')
              network_tests = network_tests.replace(
                  marker_net, insert + marker_net, 1
              )
          network_test_path.write_text(network_tests, encoding='utf-8')

          # Timing/diagnostic counters make future performance reports measurable.
          text = plugin_path.read_text(encoding='utf-8')
          stats_anchor = '        "saucenao_review_band_matches": 0,\n'
          if '"visual_search_seconds": 0.0,' not in text:
              text = text.replace(
                  stats_anchor,
                  stats_anchor
                  + '        "fast_stages_reused": 0,\n'
                  + '        "visual_search_images": 0,\n'
                  + '        "visual_search_seconds": 0.0,\n',
                  1,
              )
          finalize_anchor = (
              '    stats["images_per_minute"] = round((seen * 60.0) / elapsed, 2) if elapsed > 0 and seen else 0.0\n'
          )
          finalize_extra = '''    visual_images = int(stats.get("visual_search_images", 0) or 0)
    visual_seconds = float(stats.get("visual_search_seconds", 0.0) or 0.0)
    stats["average_visual_seconds_per_image"] = (
        round(visual_seconds / visual_images, 2) if visual_images else 0.0
    )
'''
          if finalize_extra not in text:
              text = text.replace(
                  finalize_anchor, finalize_anchor + finalize_extra, 1
              )

          # Reset the outage timer at the beginning of every bulk invocation.
          global_line = (
              '    global _SAUCENAO_PAUSE_UNTIL, _SAUCENAO_QUOTA_PAUSES, _SAUCENAO_QUOTA_ANNOUNCED\n'
          )
          if '_SAUCENAO_OUTAGE_UNTIL' not in text[text.find('def import_all'):text.find('def import_all') + 2000]:
              text = text.replace(
                  global_line,
                  global_line + '    global _SAUCENAO_OUTAGE_UNTIL\n',
                  1,
              )
              reset_line = '    _SAUCENAO_QUOTA_ANNOUNCED = False\n'
              import_all_pos = text.find('def import_all')
              reset_pos = text.find(reset_line, import_all_pos)
              if reset_pos < 0:
                  raise SystemExit('SauceNAO reset anchor not found')
              reset_pos += len(reset_line)
              text = (
                  text[:reset_pos]
                  + '    _SAUCENAO_OUTAGE_UNTIL = 0.0\n'
                  + text[reset_pos:]
              )
          plugin_path.write_text(text, encoding='utf-8')

          readme_path = Path('plugins/DanbooruTagImporter/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '# Booru Importer v3.26.3', '# Booru Importer v3.26.4', 1
          )
          goal_start = 'v3.26.3 expands the artist-exclusion policy:'
          if goal_start in readme:
              paragraph_start = readme.index(goal_start)
              paragraph_end = readme.find('\n\n', paragraph_start)
              old_para = readme[paragraph_start:paragraph_end]
              new_para = (
                  'v3.26.4 substantially improves Deep Match throughput. Images already '
                  'marked Unresolved reuse the completed Fast Scan result instead of '
                  'repeating MD5 and local pHash lookups. Danbooru IQDB, e621 IQDB, and '
                  'SauceNAO execute concurrently while retaining the existing match-priority '
                  'and confidence rules. Visual HTTP requests use a 30-second timeout with '
                  'no inline retries so transient failures stay eligible for Retry Later '
                  'instead of blocking one image for minutes. SauceNAO Cloudflare/origin '
                  '52x errors enter a short provider-only cooldown. Artist handling from '
                  'v3.26.3 is unchanged.'
              )
              readme = readme.replace(old_para, new_para, 1)
          readme_path.write_text(readme, encoding='utf-8')
          PY

          git diff --check
          PYTHONDONTWRITEBYTECODE=1 python -m py_compile plugins/DanbooruTagImporter/*.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s plugins/DanbooruTagImporter/tests -v

      - name: Commit tested performance fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "purpsll"
          git config user.email "105087296+purpsll@users.noreply.github.com"
          git add plugins/DanbooruTagImporter
          git commit -m "Speed up unresolved Deep Match"
          git push origin HEAD:main
