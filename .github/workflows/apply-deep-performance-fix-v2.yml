              1,
          )
          task_path.write_text(task_text, encoding='utf-8')

          safety_path = Path('plugins/DanbooruTagImporter/tests/test_plugin_safety.py')
          tests = safety_path.read_text(encoding='utf-8')
          marker = '    def test_conditional_dnp_artist_is_skipped_for_studio_selection(self):\n'
          if marker not in tests:
