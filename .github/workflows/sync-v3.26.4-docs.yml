name: Sync v3.26.4 Documentation

on:
  push:
    paths:
      - '.github/workflows/sync-v3.26.4-docs.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update documentation and release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          root = Path("README.md")
          replace_once(
              root,
              "Booru-Importer-v3.26.3.zip",
              "Booru-Importer-vX.Y.Z.zip",
              "root README release asset example",
          )
          replace_once(
              root,
              "Booru Importer only accepts strong matches automatically. Less-certain matches can be placed into a **Review** state instead of being treated as definite.\n",
              "Booru Importer only accepts strong matches automatically. Less-certain matches can be placed into a **Review** state instead of being treated as definite.\n\nIn **v3.26.4**, images already marked **Unresolved** do not repeat the Fast Scan work they already completed. Deep Match goes directly to visual search, uploads a Stash-generated 640px thumbnail instead of the original full-resolution image, and can run e621 IQDB and SauceNAO in parallel after Danbooru IQDB misses. This speeds up large unresolved queues without lowering the existing confidence thresholds.\n",
              "root README Deep Match performance note",
          )
          replace_once(
              root,
              "Deep Match may send the image itself to configured reverse-image-search services such as **Danbooru IQDB, e621 IQDB, or SauceNAO** so they can look for visually similar images.",
              "Deep Match sends a **Stash-generated 640px thumbnail**—not the original full-resolution image—to configured reverse-image-search services such as **Danbooru IQDB, e621 IQDB, or SauceNAO** so they can look for visually similar images.",
              "root README Deep Match privacy wording",
          )

          technical = Path("plugins/DanbooruTagImporter/README.md")
          replace_once(
              technical,
              "- Stash with external-plugin support. The workflow was exercised live on Stash v0.31.1 during the v3.23 cycle; the v3.24/v3.25 public-release changes are covered by the automated regression suite and should receive one final live smoke test before publication.",
              "- Stash with external-plugin support. The workflow was exercised live on Stash v0.31.1 during development, and the v3.26.4 release workflow runs the full automated regression suite before packaging the public release.",
              "technical README requirements",
          )
          replace_once(
              technical,
              "After exact MD5 and local pHash source reuse, it tries the configured visual-search stages:\n\n1. Danbooru IQDB, when Danbooru credentials are configured\n2. e621 IQDB\n3. SauceNAO, when an API key is configured",
              "For images already marked `Multi-Booru Unresolved` by the normal Fast Scan, v3.26.4 reuses that completed fast-stage result instead of repeating exact MD5 and local pHash lookups. Forced rechecks such as Review and No-Match retries still reevaluate the full lookup path.\n\nVisual search keeps Danbooru IQDB first. If Danbooru IQDB misses, e621 IQDB and SauceNAO (when configured) are launched concurrently:\n\n1. Danbooru IQDB, when Danbooru credentials are configured\n2. e621 IQDB and SauceNAO in parallel, when their respective stages are enabled/configured",
              "technical README Deep Match order",
          )
          replace_once(
              technical,
              "- **Deep Match:** may send the existing Stash image bytes in-memory to Danbooru IQDB, e621 IQDB, and SauceNAO when those stages are active. The plugin does not save a duplicate image locally and does not download a replacement/source image.",
              "- **Deep Match:** sends a Stash-generated 640px thumbnail in-memory to Danbooru IQDB, e621 IQDB, and SauceNAO when those stages are active, rather than uploading the original full-resolution image. The plugin does not save a duplicate image locally and does not download a replacement/source image.",
              "technical README privacy wording",
          )
          replace_once(
              technical,
              "- SauceNAO long-term quota: account-reported `long_limit` / `long_remaining` is tracked so exhausted accounts do not produce false No Match results\n- General external-provider minimum spacing: 250 ms per host",
              "- SauceNAO long-term quota: account-reported `long_limit` / `long_remaining` is tracked so exhausted accounts do not produce false No Match results\n- Deep visual-search payload: Stash-generated 640px thumbnail rather than the original full-resolution image\n- Deep visual-search timeout: 30 seconds per request with no inline upload retries; transient failures remain retryable\n- After Danbooru IQDB misses, e621 IQDB and SauceNAO may run concurrently with at most 2 visual-search workers\n- SauceNAO HTTP 520–524: 180-second SauceNAO-only outage cooldown while other providers continue\n- General external-provider minimum spacing: 250 ms per host",
              "technical README fixed performance policy",
          )
          replace_once(
              technical,
              "Before publishing from your own repository, set the plugin manifest's project/support URL to your repository or support page and choose an explicit software license. If contributing to Stash CommunityScripts, follow that repository's current contribution and AI-assistance policies and perform your own manual review/testing of the code.",
              "The public repository publishes Stash source packages through GitHub Pages and manual-install ZIPs through GitHub Releases. The release workflow runs the full regression suite before packaging. Keep `VERSION` in `constants.py` synchronized with `version:` in `DanbooruTagImporter.yml`, and update the release notes whenever user-visible behavior changes.",
              "technical README publishing guidance",
          )

          release = Path(".github/workflows/release.yml")
          text = release.read_text(encoding="utf-8")
          start_marker = "          cat > release-current.md <<'EOF'\n"
          end_marker = "          EOF\n\n      - name: Update initial public release notes"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("release-current block markers not found")
          end += len("          EOF\n")
          new_lines = [
              "          cat > release-current.md <<'EOF'",
              "          ## Booru Importer v3.26.4",
              "",
              "          This patch release makes Deep Match substantially faster for images that already completed Fast Scan, while keeping the existing confidence thresholds and metadata policy.",
              "",
              "          ### Performance improvements",
              "",
              "          - **Unresolved Deep Match reuses completed Fast Scan work.** Images already carrying `Multi-Booru Unresolved` no longer repeat exact MD5 and local pHash stages before visual search.",
              "          - **Smaller reverse-search uploads.** Deep Match now sends Stash's generated 640px thumbnail to visual-search providers instead of the original full-resolution image.",
              "          - **Parallel visual fallbacks.** Danbooru IQDB remains first. After it misses, e621 IQDB and SauceNAO can run concurrently, reducing per-image latency when both are available.",
              "          - **Bounded visual requests.** Reverse-search uploads use a 30-second single-attempt timeout with no inline retries. Temporary network/provider failures remain retryable instead of blocking one image for minutes.",
              "          - **SauceNAO outage isolation.** HTTP 520–524 responses open a short SauceNAO-only cooldown while the other providers continue normally.",
              "",
              "          ### Behavior retained",
              "",
              "          - Existing automatic-match and Review thresholds are unchanged.",
              "          - The first usable artist still becomes the Studio, additional usable artists remain tags, and `conditional_dnp` / `third-party_edit` remain ignored as artist metadata.",
              "          - Existing ordinary Stash metadata remains preserved.",
              "          - SauceNAO pacing remains account-aware and supports upgraded/paid account limits.",
              "          - Temporary provider failures still do not become false permanent No Match decisions.",
              "",
              "          ### Validation",
              "",
              "          - The release workflow runs the full automated regression suite before packaging.",
              "          - The Stash repository package and manual GitHub Release ZIP are built from the same v3.26.4 source.",
              "          - The downloadable ZIP contains a ready-to-copy `DanbooruTagImporter/` folder for manual installation.",
              "",
              "          ### Recommended installation / update",
              "",
              "          Add or refresh this source in **Stash → Settings → Plugins**:",
              "",
              "          `https://purpsll.github.io/Booru-Tagger/main/index.yml`",
              "",
              "          Existing source-based users should see **Booru Importer 3.26.4** as an update.",
              "",
              "          ### Manual installation from GitHub Releases",
              "",
              "          1. Under **Assets**, download **`Booru-Importer-v3.26.4.zip`**. Do not use GitHub's automatically generated **Source code** archives for the simplest manual install.",
              "          2. Extract the ZIP. It contains a top-level **`DanbooruTagImporter`** folder.",
              "          3. Copy that entire folder into your Stash plugins directory.",
              "          4. The final path should look like: **`<Stash plugins>/DanbooruTagImporter/DanbooruTagImporter.yml`**.",
              "          5. In Stash, go to **Settings → Plugins** and reload plugins.",
              "          6. Configure any optional provider credentials in the Booru Importer settings.",
              "          EOF",
              "",
          ]
          text = text[:start] + "\n".join(new_lines) + text[end:]
          release.write_text(text, encoding="utf-8")
          PY

      - name: Validate updated source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s plugins/DanbooruTagImporter/tests -v
          rm -rf /tmp/booru-site
          bash build_site.sh /tmp/booru-site
          grep -q 'version: 3.26.4-' /tmp/booru-site/index.yml
          grep -q 'name: Booru Importer' /tmp/booru-site/index.yml
          cat /tmp/booru-site/index.yml

      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-v3.26.4-docs.yml
          git add README.md plugins/DanbooruTagImporter/README.md .github/workflows/release.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Publish Booru Importer 3.26.4 documentation and release'
          git push origin HEAD:main
