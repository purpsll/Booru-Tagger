name: Validate Review UI React fix 3.26.11

on:
  push:
    branches:
      - test/react-after-context-32611
    paths:
      - '.github/workflows/validate-react-context-32611.yml'
      - 'README.md'
      - 'plugins/DanbooruTagImporter/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile source and check UI syntax
        run: |
          python -m py_compile plugins/DanbooruTagImporter/*.py
          node --check plugins/DanbooruTagImporter/BooruImporterReview.js

      - name: Run regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s plugins/DanbooruTagImporter/tests -v

      - name: Validate React patch and package
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'VERSION = "3.26.11"' plugins/DanbooruTagImporter/constants.py
          grep -qx 'version: 3.26.11' plugins/DanbooruTagImporter/DanbooruTagImporter.yml
          grep -Fq 'PluginApi.patch.after("ImageDetailPanel", function (props, _context, rendered)' plugins/DanbooruTagImporter/BooruImporterReview.js
          ! grep -Fq 'PluginApi.patch.after("ImageDetailPanel", function (props, rendered)' plugins/DanbooruTagImporter/BooruImporterReview.js
          grep -Fq 'React patch signature' README.md
          grep -Fq 'patch.after' plugins/DanbooruTagImporter/README.md
          git diff --check
          chmod +x build_site.sh
          ./build_site.sh
          grep -q 'id: DanbooruTagImporter' _site/index.yml
          grep -q 'version: 3.26.11-' _site/index.yml
          test -f _site/DanbooruTagImporter.zip
          unzip -l _site/DanbooruTagImporter.zip | grep -q 'BooruImporterReview.js'
