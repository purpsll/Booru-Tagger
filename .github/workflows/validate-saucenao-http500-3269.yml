name: Validate SauceNAO HTTP 500 hardening 3.26.9

on:
  push:
    branches:
      - test/saucenao-http500-3269
    paths:
      - '.github/workflows/validate-saucenao-http500-3269.yml'
      - 'README.md'
      - 'plugins/DanbooruTagImporter/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile source
        run: python -m py_compile plugins/DanbooruTagImporter/*.py

      - name: Run regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s plugins/DanbooruTagImporter/tests -v

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'VERSION = "3.26.9"' plugins/DanbooruTagImporter/constants.py
          grep -qx 'version: 3.26.9' plugins/DanbooruTagImporter/DanbooruTagImporter.yml
          grep -q 'if exc.code in {500, 520, 521, 522, 523, 524}:' plugins/DanbooruTagImporter/DanbooruTagImporter.py
          grep -q 'HTTP (?:500|52\[0-4\])' plugins/DanbooruTagImporter/DanbooruTagImporter.py
          git diff --check
          chmod +x build_site.sh
          ./build_site.sh
          grep -q 'id: DanbooruTagImporter' _site/index.yml
          grep -q 'version: 3.26.9-' _site/index.yml
          test -f _site/DanbooruTagImporter.zip
