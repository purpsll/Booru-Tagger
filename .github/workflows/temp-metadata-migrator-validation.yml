name: Temporary Metadata Migrator Validation

on:
  push:
    branches:
      - feature/stash-metadata-migrator

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile migrator
        run: python -m py_compile plugins/StashMetadataMigrator/*.py
      - name: Test metadata migrator
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s plugins/StashMetadataMigrator/tests -v
      - name: Test Booru Importer regression suite
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s plugins/DanbooruTagImporter/tests -v
