name: Apply conditional_dnp studio-selection fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-conditional-dnp-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply patch and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('plugins/DanbooruTagImporter')

          plugin = root / 'DanbooruTagImporter.py'
          text = plugin.read_text()
          old = '''    performers = characters if character_mapping in {"performers", "both"} else []\n    studio_artists = artists if artist_mapping in {"studios", "both"} else []\n    studio_targets = (\n        studio_artists if create_secondary_artist_studios else studio_artists[:1]\n    )\n'''
          new = '''    performers = characters if character_mapping in {"performers", "both"} else []\n    studio_artists = (\n        [\n            artist for artist in artists\n            if str(artist).strip().casefold() != "conditional_dnp"\n        ]\n        if artist_mapping in {"studios", "both"}\n        else []\n    )\n    studio_targets = (\n        studio_artists if create_secondary_artist_studios else studio_artists[:1]\n    )\n'''
          if old not in text:
              raise SystemExit('Expected Studio selection block was not found; refusing to patch.')
          plugin.write_text(text.replace(old, new, 1))

          # Public patch release: keep the manifest, runtime User-Agent, and version test aligned.
          for rel in ('DanbooruTagImporter.yml', 'constants.py', 'tests/test_task_menu.py'):
              path = root / rel
              value = path.read_text()
              if '3.26.0' not in value:
                  raise SystemExit(f'Expected 3.26.0 version marker missing from {rel}')
              path.write_text(value.replace('3.26.0', '3.26.1'))

          readme = root / 'README.md'
          value = readme.read_text()
          value = value.replace('# Multi-Booru Tag Importer v3.26.0', '# Multi-Booru Tag Importer v3.26.1', 1)
          old_release = 'v3.26.0 keeps the public-release hardening from v3.24.0 and adds account-aware SauceNAO throughput. It intentionally does not change the established matching thresholds or five-task workflow.'
          new_release = 'v3.26.1 adds a Studio-selection guard for the booru placeholder artist `conditional_dnp`. When it appears in an artist list, it is ignored for Studio assignment and the next real artist is selected. This release retains the public-release hardening and account-aware SauceNAO throughput introduced in v3.26.0, without changing the established matching thresholds or five-task workflow.'
          if old_release not in value:
              raise SystemExit('Expected technical README release text was not found; refusing to patch.')
          readme.write_text(value.replace(old_release, new_release, 1))

          tests = root / 'tests/test_plugin_safety.py'
          value = tests.read_text()
          anchor = '''        self.assertTrue(any("Studio 'sample_artist' would be assigned" in message for _level, message in logs))\n\n'''
          addition = '''        self.assertTrue(any("Studio 'sample_artist' would be assigned" in message for _level, message in logs))\n\n    def test_conditional_dnp_artist_is_skipped_for_studio_selection(self):\n        stash = ProcessFakeStash()\n        settings = {"gelbooru_api_key": "gkey", "gelbooru_user_id": "42"}\n        post = {\n            "id": 12345,\n            "tags": "conditional_dnp sample_artist blue_hair",\n        }\n        typed = {\n            "conditional_dnp": 1,\n            "sample_artist": 1,\n            "blue_hair": 0,\n        }\n        logs = []\n        with mock.patch.object(plugin, "ENABLE_DANBOORU", False), \\\n             mock.patch.object(plugin, "ENABLE_RULE34", False), \\\n             mock.patch.object(plugin, "ENABLE_E621", False), \\\n             mock.patch.object(plugin, "ENABLE_LOCAL_PHASH_REUSE", False), \\\n             mock.patch.object(plugin, "gelbooru_post", return_value=post), \\\n             mock.patch.object(plugin, "gelbooru_style_tag_metadata", return_value=typed), \\\n             mock.patch.object(plugin, "ensure_studio") as ensure_studio, \\\n             mock.patch.object(plugin, "log", side_effect=lambda level, message: logs.append((level, message))):\n            result = plugin.process_image(\n                stash, md5_image(), settings, {}, True, {}, {}, {}, {},\n                plugin.PHashIndex(), lookup_mode="fast",\n            )\n\n        self.assertEqual(result, "matched_gelbooru")\n        studio_names = [call.args[2] for call in ensure_studio.call_args_list]\n        self.assertIn("sample_artist", studio_names)\n        self.assertNotIn("conditional_dnp", studio_names)\n        self.assertTrue(any("Studio 'sample_artist' would be assigned" in message for _level, message in logs))\n\n'''
          if anchor not in value:
              raise SystemExit('Expected regression-test insertion point was not found; refusing to patch.')
          tests.write_text(value.replace(anchor, addition, 1))
          PY

          cd plugins/DanbooruTagImporter
          python -m unittest discover -s tests -v

      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name 'purpsll'
          git config user.email '105087296+purpsll@users.noreply.github.com'
          git rm .github/workflows/apply-conditional-dnp-fix.yml
          git add plugins/DanbooruTagImporter
          git commit -m 'Skip conditional_dnp when selecting artist studios'
          git push
