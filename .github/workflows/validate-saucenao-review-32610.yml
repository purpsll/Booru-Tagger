name: Validate SauceNAO review floor 3.26.10

on:
  push:
    branches:
      - test/saucenao-review-85-32610
    paths:
      - '.github/workflows/validate-saucenao-review-32610.yml'
      - 'README.md'
      - 'plugins/DanbooruTagImporter/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile source
        run: python -m py_compile plugins/DanbooruTagImporter/*.py

      - name: Run regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s plugins/DanbooruTagImporter/tests -v

      - name: Validate policy and source package
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'VERSION = "3.26.10"' plugins/DanbooruTagImporter/constants.py
          grep -qx 'version: 3.26.10' plugins/DanbooruTagImporter/DanbooruTagImporter.yml
          grep -qx 'SAUCENAO_HIGH_CONFIDENCE = 95.0' plugins/DanbooruTagImporter/constants.py
          grep -qx 'SAUCENAO_REVIEW_MINIMUM = 85.0' plugins/DanbooruTagImporter/constants.py
          git diff --check
          chmod +x build_site.sh
          ./build_site.sh
          grep -q 'id: DanbooruTagImporter' _site/index.yml
          grep -q 'version: 3.26.10-' _site/index.yml
          test -f _site/DanbooruTagImporter.zip
