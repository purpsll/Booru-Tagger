name: Validate SauceNAO visible threshold 3.26.13

on:
  push:
    branches:
      - test/saucenao-visible-threshold-32613
    paths:
      - '.github/workflows/validate-saucenao-threshold-32613.yml'
      - 'README.md'
      - 'plugins/DanbooruTagImporter/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile source and check UI syntax
        run: |
          python -m py_compile plugins/DanbooruTagImporter/*.py
          node --check plugins/DanbooruTagImporter/BooruImporterReview.js

      - name: Run regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s plugins/DanbooruTagImporter/tests -v

      - name: Validate SauceNAO visible threshold and package
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'VERSION = "3.26.13"' plugins/DanbooruTagImporter/constants.py
          grep -qx 'version: 3.26.13' plugins/DanbooruTagImporter/DanbooruTagImporter.yml
          grep -Fq 'def _saucenao_policy_score' plugins/DanbooruTagImporter/DanbooruTagImporter.py
          grep -Fq 'raw 94.96' plugins/DanbooruTagImporter/README.md
          grep -Fq 'displayed as **95.0%** is HIGH' README.md
          grep -Fq 'displayed as 95.0%' plugins/DanbooruTagImporter/DanbooruTagImporter.yml
          git diff --check
          chmod +x build_site.sh
          ./build_site.sh
          grep -q 'id: DanbooruTagImporter' _site/index.yml
          grep -q 'version: 3.26.13-' _site/index.yml
          test -f _site/DanbooruTagImporter.zip
          unzip -l _site/DanbooruTagImporter.zip | grep -q 'DanbooruTagImporter.py'
