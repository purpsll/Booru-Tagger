name: Temporary external review validation

on:
  push:
    branches:
      - fix/external-saucenao-review-band

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Booru Importer regression suite
        working-directory: plugins/DanbooruTagImporter
        run: python -m unittest discover -s tests -v
